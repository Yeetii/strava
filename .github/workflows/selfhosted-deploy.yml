name: Deploy self-hosted Stigar

on:
  push:
    branches:
      - main
    paths:
      - 'Stigar.Api/**'
      - 'Stigar.Workers/**'
      - 'Stigar.Workers.Pmtiles/**'
      - 'Stigar.Core/**'
      - 'Directory.Build.props'
      - 'deploy/**'
      - '.github/workflows/selfhosted-deploy.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Existing image tag to deploy (leave empty to build the current commit)'
        required: false
        default: ''

concurrency:
  group: selfhosted-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Verify the native API/Workers architecture
        run: ./deploy/scripts/verify-role-coverage.sh

  build:
    needs: verify
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.image_tag != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: api
            project: Stigar.Api
            dockerfile: deploy/docker/plain-host.Dockerfile
          - name: backend
            project: Stigar.Workers
            dockerfile: deploy/docker/plain-host.Dockerfile
          - name: pmtiles
            project: Stigar.Workers.Pmtiles
            dockerfile: Stigar.Workers.Pmtiles/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Normalise image namespace
        run: echo "IMAGE_NAMESPACE=${GITHUB_REPOSITORY_OWNER,,}" >>"${GITHUB_ENV}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            PROJECT=${{ matrix.project }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/stigar-${{ matrix.name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/stigar-${{ matrix.name }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    needs:
      - verify
      - build
    if: >-
      always() &&
      needs.verify.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    environment: self-hosted
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Validate image tag
        env:
          REQUESTED_TAG: ${{ inputs.image_tag || github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "${REQUESTED_TAG}" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "Invalid image tag: ${REQUESTED_TAG}" >&2
            exit 1
          fi

      - name: Connect runner to the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: strava-gh-deploy
          # New tailnet peers need a moment to become reachable; the action
          # retries this ping for up to 3 minutes before proceeding.
          ping: ${{ secrets.SELFHOSTED_HOST }}

      - name: Sync deployment assets and deploy over Tailscale SSH
        env:
          SSH_HOST: ${{ secrets.SELFHOSTED_HOST }}
          SSH_USER: ${{ secrets.SELFHOSTED_USER }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "${SSH_HOST}" || -z "${SSH_USER}" ]]; then
            echo "SELFHOSTED_HOST and SELFHOSTED_USER must be configured." >&2
            exit 1
          fi
          if [[ -z "${TS_OAUTH_CLIENT_ID:-}" ]]; then
            echo "TS_OAUTH_CLIENT_ID and TS_OAUTH_SECRET must be configured." >&2
            exit 1
          fi

          # Tailscale SSH authenticates the connection (no SSH keys), handles
          # host-key verification, and only works on port 22.
          ssh_opts=(-o BatchMode=yes -o ConnectTimeout=15 -o StrictHostKeyChecking=accept-new)

          rsync -az --delete \
            --exclude '.env' \
            --exclude 'backups' \
            --exclude 'ansible/inventory.ini' \
            -e "ssh ${ssh_opts[*]}" \
            deploy/ "${SSH_USER}@${SSH_HOST}:/opt/stacks/strava/"

          ssh "${ssh_opts[@]}" \
            "${SSH_USER}@${SSH_HOST}" \
            "bash /opt/stacks/strava/scripts/deploy.sh '${IMAGE_TAG}'"

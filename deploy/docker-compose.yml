name: peakshunters

# Internal-only deployment. Public exposure is provided by Tailscale Funnel
# (see docs/tailscale-funnel-runbook.md), not by published ports.
#
# Azure Functions is gone: all four containers run plain .NET 10 hosts. Roles
# are selected with WORKER_ROLE (api | schedule | heavy) instead of the old
# per-function whitelist environment entries.
#
# Cosmos DB, Blob, Tables and Azure SignalR stay on Azure. Service Bus is kept
# for P1a and removed in P2 (see the Azure Functions Runtime Exit plan).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-plain-env: &plain-env
  DOTNET_ENVIRONMENT: Production
  RedisConnectionString: ${REDIS_CONNECTION_STRING:-redis:6379,abortConnect=false}

x-service: &service
  restart: unless-stopped
  logging: *default-logging
  networks:
    - backend

x-app-service: &app-service
  <<: *service
  env_file:
    - .env

x-http-healthcheck: &http-healthcheck
  test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/80'"]
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 30s

x-worker-healthcheck: &worker-healthcheck
  test: ["CMD-SHELL", "pgrep -f 'dotnet' >/dev/null"]
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 30s

services:
  # ---------------------------------------------------------------------------
  # User-facing API. ASP.NET Core (Kestrel) hosting all 59 API endpoints at
  # their original /api/... routes.
  # ---------------------------------------------------------------------------
  api:
    <<: *app-service
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE must be set}/peakshunters-api:${IMAGE_TAG:-latest}
    environment:
      <<: *plain-env
      WORKER_ROLE: api
    expose:
      - "80"
    # Tailscale Funnel on the host forwards to a loopback port. Only publish
    # on 127.0.0.1 so the API stays off the public interface and LAN.
    ports:
      - "127.0.0.1:8080:80"
    healthcheck: *http-healthcheck
    mem_limit: ${API_MEMORY_LIMIT:-1g}
    cpus: "${API_CPUS:-1.0}"
    depends_on:
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Backend HTTP functions: Strava webhook, token refresh, admin and backfill
  # endpoints. Same image as the workers; the role selects the HTTP host.
  # ---------------------------------------------------------------------------
  backend-api:
    <<: *app-service
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE must be set}/peakshunters-backend:${IMAGE_TAG:-latest}
    environment:
      <<: *plain-env
      WORKER_ROLE: api
      ApiUrl: http://api/api/
      BackendApiUrl: http://backend-api/api/
    expose:
      - "80"
    healthcheck: *http-healthcheck
    mem_limit: ${BACKEND_API_MEMORY_LIMIT:-1g}
    cpus: "${BACKEND_API_CPUS:-1.0}"
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Scheduled jobs (the 12 weekly crons) as Hangfire recurring jobs on Redis.
  # Enable with COMPOSE_PROFILES=schedules after disabling the matching Azure
  # timer functions.
  # ---------------------------------------------------------------------------
  worker-schedule:
    <<: *app-service
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE must be set}/peakshunters-backend:${IMAGE_TAG:-latest}
    profiles: ["schedules"]
    environment:
      <<: *plain-env
      WORKER_ROLE: schedule
      ApiUrl: http://api/api/
      BackendApiUrl: http://backend-api/api/
    healthcheck: *worker-healthcheck
    mem_limit: ${WORKER_SCHEDULE_MEMORY_LIMIT:-1g}
    cpus: "${WORKER_SCHEDULE_CPUS:-1.0}"
    depends_on:
      api:
        condition: service_healthy
      backend-api:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Heavy workers: Service Bus queue consumers + Cosmos change-feed processors.
  # Enable with COMPOSE_PROFILES=workers. While Azure and this container both
  # listen to a queue they act as competing consumers; disable the Azure worker
  # functions to take 100% of the load. P2 swaps these to Hangfire jobs.
  # ---------------------------------------------------------------------------
  worker-heavy:
    <<: *app-service
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE must be set}/peakshunters-backend:${IMAGE_TAG:-latest}
    profiles: ["workers"]
    environment:
      <<: *plain-env
      WORKER_ROLE: heavy
      ApiUrl: http://api/api/
      BackendApiUrl: http://backend-api/api/
    healthcheck: *worker-healthcheck
    mem_limit: ${WORKER_HEAVY_MEMORY_LIMIT:-2g}
    cpus: "${WORKER_HEAVY_CPUS:-2.0}"
    depends_on:
      api:
        condition: service_healthy
      backend-api:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Durable Redis backing Hangfire (recurring + queue jobs). AOF + noeviction
  # are required: Hangfire job state must never be evicted under memory pressure.
  # ---------------------------------------------------------------------------
  redis:
    <<: *service
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  backend:
    driver: bridge

volumes:
  redis-data:

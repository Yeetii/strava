name: peakshunters

# Internal-only deployment. Public exposure is provided by Tailscale Funnel
# (see docs/tailscale-funnel-runbook.md), not by published ports.
#
# All containers run plain .NET 10 hosts. Roles are selected with WORKER_ROLE
# (schedule | heavy) instead of the old per-function whitelist entries.
#
# All Azure services are decommissioned. Structured data lives in PostgreSQL;
# organizer data, race tiles, highway shards and zoom indexes are local bind
# mounts. No cloud connection strings are required.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-plain-env: &plain-env
  DOTNET_ENVIRONMENT: Production
  RedisConnectionString: ${REDIS_CONNECTION_STRING:-redis:6379,abortConnect=false}
  PostgresConnectionString: ${POSTGRES_CONNECTION_STRING:-Host=postgres;Database=strava;Username=strava;Password=${POSTGRES_PASSWORD:-strava};GSS Encryption Mode=Disable}

x-service: &service
  restart: unless-stopped
  logging: *default-logging
  networks:
    - backend

x-app-service: &app-service
  <<: *service
  env_file:
    - .env

x-http-healthcheck: &http-healthcheck
  test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/80'"]
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 30s

x-worker-healthcheck: &worker-healthcheck
  test: ["CMD-SHELL", "pgrep -f 'dotnet' >/dev/null"]
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 30s

services:
  # ---------------------------------------------------------------------------
  # User-facing API. ASP.NET Core (Kestrel) hosting all 59 API endpoints at
  # their original /api/... routes.
  # ---------------------------------------------------------------------------
  api:
    <<: *app-service
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE must be set}/stigar-api:${IMAGE_TAG:-latest}
    environment:
      <<: *plain-env
      # All non-queue organizer wiring uses the shared local store, so admin
      # writes and the weekly build see the same data.
      OrganizerStore__Provider: FileSystem
      OrganizerStore__RaceDataDir: /data/races
      # Highway shards and zoom indexes are local too, so the API host needs no
      # external store connection.
      ShardStore__Provider: FileSystem
      ShardStore__RootDir: /data/shards
    expose:
      - "80"
    # Tailscale Funnel on the host forwards to a loopback port. Only publish
    # on 127.0.0.1 so the API stays off the public interface and LAN.
    ports:
      - "127.0.0.1:8080:80"
    # Shared race data (writable): admin endpoints may write organizer.json
    # when the FileSystem store is selected; the public tile endpoint reads
    # /data/races/tiles/trails.pmtiles read-only.
    volumes:
      - ${RACE_DATA_DIR:-/opt/data/strava/races}:/data/races
      - ${SHARD_DATA_DIR:-/opt/data/strava/shards}:/data/shards
    healthcheck: *http-healthcheck
    mem_limit: ${API_MEMORY_LIMIT:-1g}
    cpus: "${API_CPUS:-1.0}"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Scheduled jobs (the 12 weekly crons) plus the sole consumer of the
  # backend-polling and recurring-jobs queues. Enable with COMPOSE_PROFILES=schedules.
  # ---------------------------------------------------------------------------
  worker-schedule:
    <<: *app-service
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE must be set}/stigar-workers:${IMAGE_TAG:-latest}
    profiles: ["schedules"]
    environment:
      <<: *plain-env
      WORKER_ROLE: schedule
      OrganizerStore__Provider: FileSystem
      OrganizerStore__RaceDataDir: /data/races
      ShardStore__Provider: FileSystem
      ShardStore__RootDir: /data/shards
    volumes:
      - ${RACE_DATA_DIR:-/opt/data/strava/races}:/data/races
      - ${SHARD_DATA_DIR:-/opt/data/strava/shards}:/data/shards
    healthcheck: *worker-healthcheck
    mem_limit: ${WORKER_SCHEDULE_MEMORY_LIMIT:-1g}
    cpus: "${WORKER_SCHEDULE_CPUS:-1.0}"
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Heavy workers: the 11 typed Hangfire queue consumers. They never serve
  # backend-polling or recurring-jobs. Enable with COMPOSE_PROFILES=workers.
  # ---------------------------------------------------------------------------
  worker-heavy:
    <<: *app-service
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE must be set}/stigar-workers:${IMAGE_TAG:-latest}
    profiles: ["workers"]
    environment:
      <<: *plain-env
      WORKER_ROLE: heavy
      OrganizerStore__Provider: FileSystem
      OrganizerStore__RaceDataDir: /data/races
      ShardStore__Provider: FileSystem
      ShardStore__RootDir: /data/shards
    volumes:
      - ${RACE_DATA_DIR:-/opt/data/strava/races}:/data/races
      - ${SHARD_DATA_DIR:-/opt/data/strava/shards}:/data/shards
    healthcheck: *worker-healthcheck
    mem_limit: ${WORKER_HEAVY_MEMORY_LIMIT:-2g}
    cpus: "${WORKER_HEAVY_CPUS:-2.0}"
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Race PMTiles builder. Own image (tippecanoe compiled in) with its own
  # Hangfire worker for the weekly build; a one-shot run is:
  #   docker compose run --rm pmtiles build-race-tiles-from-organizers
  # No backing-service connection strings are needed: organizers and tile output live on
  # the host directory at /opt/data/strava/races (RACE_DATA_DIR). REDIS_CONNECTION_STRING
  # (in *plain-env) is only Hangfire storage.
  # ---------------------------------------------------------------------------
  pmtiles:
    <<: *app-service
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:?IMAGE_NAMESPACE must be set}/stigar-pmtiles:${IMAGE_TAG:-latest}
    # The image has no CMD; explicitly start the weekly Hangfire scheduler.
    # `docker compose run --rm pmtiles build-race-tiles-from-organizers`
    # overrides this for a one-shot build.
    command: schedule-race-tiles
    environment:
      <<: *plain-env
      OrganizerStore__Provider: FileSystem
      OrganizerStore__RaceDataDir: /data/races
      RaceTiles__OutputPath: /data/races/tiles/trails.pmtiles
      RaceTiles__WeeklyCron: "0 5 * * 1"
      WriteTransparency: "false"
    volumes:
      - ${RACE_DATA_DIR:-/opt/data/strava/races}:/data/races
    healthcheck: *worker-healthcheck
    mem_limit: ${PMTILES_MEMORY_LIMIT:-2g}
    cpus: "${PMTILES_CPUS:-2.0}"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Durable Redis backing Hangfire (recurring + queue jobs). AOF + noeviction
  # are required: Hangfire job state must never be evicted under memory pressure.
  # ---------------------------------------------------------------------------
  redis:
    <<: *service
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ---------------------------------------------------------------------------
  # PostgreSQL with PostGIS extension for all structured and geospatial data.
  # ---------------------------------------------------------------------------
  postgres:
    <<: *service
    image: postgis/postgis:17-3.5-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-strava}
      POSTGRES_USER: ${POSTGRES_USER:-strava}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strava}
    volumes:
      - ${POSTGRES_DATA_DIR:-/opt/data/strava/postgres}:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-strava} -d ${POSTGRES_DB:-strava}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-1g}
    cpus: "${POSTGRES_CPUS:-1.0}"

networks:
  backend:
    driver: bridge

volumes:
  redis-data:
  # Race data is a host bind mount at RACE_DATA_DIR (default /opt/data/strava/races)
  # and highway shards/indexes at SHARD_DATA_DIR (default /opt/data/strava/shards),
  # so both are visible and backup-able from the host. Only Redis uses a named volume.

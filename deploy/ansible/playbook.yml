---
- name: Provision the Peakshunters self-hosted Docker host
  hosts: peakshunters
  become: true
  vars:
    deploy_dir: /opt/stacks/strava
    ssh_port: 22

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install base packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - fail2ban
          - gnupg
          - jq
          - make
          - openssl
          - rsync
          - ufw
          - unattended-upgrades
        state: present

    - name: Create deployment directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - "{{ deploy_dir }}"

    - name: Check for the controller-side .env
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../.env"
      delegate_to: localhost
      become: false
      register: env_file

    - name: Require deploy/.env on the controller
      ansible.builtin.assert:
        that:
          - env_file.stat.exists
        fail_msg: "Create deploy/.env (see deploy/.env.example) before running this playbook."

    - name: Upload deployment assets
      ansible.posix.synchronize:
        src: "{{ playbook_dir }}/../"
        dest: "{{ deploy_dir }}/"
        delete: true
        rsync_opts:
          - "--exclude=.env"
          - "--exclude=backups"
          - "--exclude=ansible/inventory.ini"

    - name: Upload .env
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../.env"
        dest: "{{ deploy_dir }}/.env"
        mode: "0600"

    - name: Give the deploy user ownership of the deployment directory
      ansible.builtin.file:
        path: "{{ deploy_dir }}"
        state: directory
        recurse: true
        owner: "{{ ansible_user }}"

    - name: Configure UFW
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "{{ ssh_port }}"
        - "80"
        - "443"

    - name: Allow HTTP/3 over UDP
      community.general.ufw:
        rule: allow
        port: "443"
        proto: udp

    - name: Enable UFW
      community.general.ufw:
        state: enabled

    - name: Apply sysctl tuning
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        sysctl_file: /etc/sysctl.d/99-peakshunters.conf
        reload: true
      loop:
        - { name: vm.swappiness, value: "10" }
        - { name: fs.inotify.max_user_watches, value: "524288" }

    - name: Pull images
      ansible.builtin.command:
        cmd: docker compose pull
        chdir: "{{ deploy_dir }}"

    - name: Start the self-hosted stack
      ansible.builtin.command:
        cmd: docker compose up -d --remove-orphans --wait
        chdir: "{{ deploy_dir }}"

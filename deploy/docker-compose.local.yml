# Local build override. Use together with docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build

services:
  api:
    image: stigar-api:local
    build:
      context: ..
      dockerfile: deploy/docker/plain-host.Dockerfile
      args:
        PROJECT: Stigar.Api

  worker-schedule:
    image: stigar-workers:local
    build:
      context: ..
      dockerfile: deploy/docker/plain-host.Dockerfile
      args:
        PROJECT: Stigar.Workers
    environment:
      WORKER_ROLE: schedule

  worker-heavy:
    image: stigar-workers:local
    build:
      context: ..
      dockerfile: deploy/docker/plain-host.Dockerfile
      args:
        PROJECT: Stigar.Workers
    environment:
      WORKER_ROLE: heavy

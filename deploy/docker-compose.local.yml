# Local build override. Use together with docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d --build

services:
  api:
    image: peakshunters-api:local
    build:
      context: ..
      dockerfile: deploy/docker/plain-host.Dockerfile
      args:
        PROJECT: API
    environment:
      WORKER_ROLE: api

  backend-api:
    image: peakshunters-backend:local
    build:
      context: ..
      dockerfile: deploy/docker/plain-host.Dockerfile
      args:
        PROJECT: Backend
    environment:
      WORKER_ROLE: api

  worker-schedule:
    image: peakshunters-backend:local
    build:
      context: ..
      dockerfile: deploy/docker/plain-host.Dockerfile
      args:
        PROJECT: Backend
    environment:
      WORKER_ROLE: schedule

  worker-heavy:
    image: peakshunters-backend:local
    build:
      context: ..
      dockerfile: deploy/docker/plain-host.Dockerfile
      args:
        PROJECT: Backend
    environment:
      WORKER_ROLE: heavy
